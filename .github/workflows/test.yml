name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m geort.trainer --help
      - run: uv build
      - run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            GEORT_HOME="$smoke_dir/state" "$GITHUB_WORKSPACE/.venv/bin/python" -c '
from geort.utils.config_utils import get_config
from geort.utils.path import get_bundled_fk_checkpoint, get_hand_landmarker_path, get_human_data, resolve_resource_path

config = get_config("allegro_right")
assert resolve_resource_path(config["urdf_path"]).is_file()
assert get_hand_landmarker_path().is_file()
assert get_human_data("human_alex").is_file()
assert get_bundled_fk_checkpoint("allegro_right").is_file()
'
          )
