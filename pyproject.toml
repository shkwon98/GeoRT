[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geort"
version = "0.1"
description = "Geometric hand retargeting"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.23,<2",
  "torch>=2.7,<2.8",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
training = [
  "open3d>=0.19,<0.20",
  "sapien>=3.0.3,<4; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "setuptools>=77,<81; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
mediapipe = [
  "mediapipe>=0.10.14,<0.11",
  "opencv-contrib-python>=4.8,<5",
  "pyrealsense2>=2.54,<3",
  "scipy>=1.10,<2",
]
dexpilot = [
  "dex-retargeting>=0.4,<0.5",
]
manus = [
  "scipy>=1.10,<2",
]
[dependency-groups]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
include = ["geort", "geort.*", "experiments", "experiments.*"]

[tool.setuptools.package-data]
geort = ["config/*.json", "resources/**/*"]
experiments = ["robots/allegro/*.json", "robots/wuji/*.json", "configs/*.json"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
